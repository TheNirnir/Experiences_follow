<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
    <title>מעקב התנסויות</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%2338bdf8'/></linearGradient></defs><rect width='100' height='100' rx='28' fill='url(%23g)'/><path d='M28 52l14 14 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #eef1f8;
        --blob-1: rgba(99, 102, 241, .40);
        --blob-2: rgba(56, 189, 248, .34);
        --blob-3: rgba(251, 146, 60, .30);
        --glass: rgba(255, 255, 255, .58);
        --glass-strong: rgba(255, 255, 255, .86);
        --glass-border: rgba(255, 255, 255, .8);
        --line: rgba(15, 23, 42, .09);
        --text: #0f172a;
        --muted: #5b6478;
        --blue: #4f46e5;
        --blue-soft: rgba(79, 70, 229, .10);
        --orange: #e0580b;
        --orange-soft: rgba(234, 88, 12, .10);
        --green: #059669;
        --green-soft: rgba(5, 150, 105, .11);
        --danger: #dc2626;
        --shadow: 0 1px 1px rgba(15, 23, 42, .03), 0 10px 30px -10px rgba(30, 41, 90, .18);
        --radius: 22px;
        --accent: var(--blue);
        --accent-soft: var(--blue-soft);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0e1a;
          --blob-1: rgba(99, 102, 241, .32);
          --blob-2: rgba(20, 184, 166, .18);
          --blob-3: rgba(249, 115, 22, .14);
          --glass: rgba(24, 30, 52, .55);
          --glass-strong: rgba(32, 39, 66, .9);
          --glass-border: rgba(255, 255, 255, .08);
          --line: rgba(255, 255, 255, .09);
          --text: #e8ecf6;
          --muted: #98a2b8;
          --blue: #8f90ff;
          --blue-soft: rgba(143, 144, 255, .15);
          --orange: #ff9a5c;
          --orange-soft: rgba(255, 154, 92, .14);
          --green: #34d399;
          --green-soft: rgba(52, 211, 153, .14);
          --danger: #f87171;
          --shadow: 0 10px 30px -10px rgba(0, 0, 0, .6);
        }
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-tap-highlight-color: transparent;
      }
      body { min-height: 100vh; }
      /* רקע גרדיאנט רך שעליו יושבת הזכוכית */
      body::before {
        content: ''; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
        background:
          radial-gradient(40% 35% at 85% 10%, var(--blob-1), transparent 70%),
          radial-gradient(45% 40% at 10% 35%, var(--blob-2), transparent 70%),
          radial-gradient(40% 35% at 70% 95%, var(--blob-3), transparent 70%);
        animation: drift 30s ease-in-out infinite alternate;
      }
      @keyframes drift { to { transform: translate3d(-3%, 2%, 0) scale(1.06); } }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        backdrop-filter: blur(22px) saturate(170%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow);
      }

      .wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 16px 16px calc(190px + env(safe-area-inset-bottom));
      }

      /* ---------- states ---------- */
      .center-state {
        min-height: 70vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: var(--muted); text-align: center; gap: 8px;
      }
      .spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid var(--line); border-top-color: var(--blue);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- people screen ---------- */
      .hero { margin: 28px 4px 26px; }
      .eyebrow {
        display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .04em;
        color: var(--blue); background: var(--blue-soft); padding: 3px 12px; border-radius: 99px;
      }
      .hero h1 { font-size: 2.2rem; font-weight: 900; margin: 10px 0 2px; letter-spacing: -.02em; line-height: 1.15; }
      .hero p { margin: 0; color: var(--muted); }
      .demo-note {
        margin-top: 14px !important; padding: 10px 14px; border-radius: 14px;
        background: var(--orange-soft); color: var(--orange) !important; font-size: .88rem;
      }
      .pill-btn {
        margin-top: 16px; display: inline-flex; align-items: center; gap: 8px;
        padding: 9px 18px 9px 16px; border-radius: 99px; font-weight: 600;
        transition: transform .12s;
      }
      .pill-btn:active { transform: scale(.97); }
      .pill-btn svg { width: 18px; height: 18px; color: var(--blue); }
      .people {
        display: grid; gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      }
      .person {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 22px 12px 16px; border-radius: var(--radius);
        transition: transform .15s, box-shadow .2s;
      }
      .person:hover { transform: translateY(-2px); }
      .person:active { transform: scale(.97); }
      .avatar {
        width: 56px; height: 56px; border-radius: 50%; flex: none;
        display: grid; place-items: center;
        font-weight: 800; font-size: 1.2rem; color: #fff;
        background: var(--av, linear-gradient(135deg, #6366f1, #8b5cf6));
        box-shadow: 0 6px 16px -6px rgba(15, 23, 42, .35), inset 0 1px 0 rgba(255,255,255,.35);
      }
      .av-0 { --av: linear-gradient(135deg, #6366f1, #a855f7); }
      .av-1 { --av: linear-gradient(135deg, #0ea5e9, #6366f1); }
      .av-2 { --av: linear-gradient(135deg, #f59e0b, #f43f5e); }
      .av-3 { --av: linear-gradient(135deg, #10b981, #0891b2); }
      .av-4 { --av: linear-gradient(135deg, #ec4899, #8b5cf6); }
      .person .name { font-weight: 700; }
      .person .meta { font-size: .8rem; color: var(--muted); margin-top: -6px; display: flex; align-items: center; gap: 6px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
      .dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }

      /* ---------- person screen header ---------- */
      .topbar { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
      .topbar .avatar { width: 44px; height: 44px; font-size: 1rem; }
      .topbar h1 { font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
      .topbar .sub { color: var(--muted); font-size: .86rem; margin: 0; }
      .icon-btn {
        width: 42px; height: 42px; flex: none;
        display: grid; place-items: center; border-radius: 50%;
        color: var(--muted); transition: color .15s, transform .12s;
      }
      .icon-btn:hover { color: var(--text); }
      .icon-btn:active { transform: scale(.94); }
      .icon-btn svg { width: 20px; height: 20px; }
      .icon-btn.spinning svg { animation: spin .8s linear infinite; }

      /* ---------- segmented tabs ---------- */
      .seg {
        position: sticky; top: 10px; z-index: 5;
        display: grid; grid-template-columns: 1fr 1fr;
        padding: 5px; margin-bottom: 18px; border-radius: 18px;
      }
      .seg-ind {
        position: absolute; top: 5px; bottom: 5px; inset-inline-start: 5px;
        width: calc(50% - 5px); border-radius: 13px;
        background: var(--glass-strong);
        box-shadow: 0 2px 10px -2px rgba(15, 23, 42, .15);
        transform: translateX(calc(var(--i, 0) * -100%));
        transition: transform .32s cubic-bezier(.3, 1.3, .5, 1);
      }
      .tab {
        position: relative; border: 0; background: transparent;
        padding: 10px 8px; font-weight: 600; color: var(--muted);
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: color .2s;
      }
      .tab .count {
        min-width: 22px; padding: 0 7px; border-radius: 99px;
        font-size: .76rem; line-height: 21px; font-weight: 700;
        background: var(--line); color: var(--muted);
      }
      .tab.active { color: var(--accent); }
      .tab.active .count { background: var(--accent); color: #fff; }

      .t-0 { --accent: var(--blue); --accent-soft: var(--blue-soft); }
      .t-1 { --accent: var(--orange); --accent-soft: var(--orange-soft); }

      /* ---------- cards ---------- */
      .list { display: grid; gap: 12px; }
      .section-title {
        font-size: .8rem; font-weight: 700; color: var(--muted);
        margin: 14px 6px -2px; display: flex; align-items: center; gap: 10px;
      }
      .section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
      .card { border-radius: var(--radius); overflow: hidden; }
      .card.done { --accent: var(--green); --accent-soft: var(--green-soft); }

      .card-head {
        width: 100%; border: 0; background: transparent; text-align: start;
        display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      }
      .ch-text { flex: 1; min-width: 0; }
      .ch-text h3 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.35; word-break: break-word; }
      .ch-sub { display: block; font-size: .84rem; color: var(--muted); margin-top: 1px; }
      .ch-sub b { color: var(--accent); font-weight: 600; }
      .chev { width: 20px; height: 20px; flex: none; color: var(--muted); transition: transform .3s; }
      .card.open .chev { transform: rotate(180deg); }

      .ring { position: relative; width: 44px; height: 44px; flex: none; }
      .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring circle { fill: none; stroke-width: 3.2; }
      .ring-bg { stroke: var(--line); }
      .ring-fg { stroke: var(--accent); stroke-linecap: round; }
      .ring-t {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-weight: 800; font-size: .95rem; color: var(--accent);
      }
      .ring-t svg { width: 18px; height: 18px; transform: none; }

      .card-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s ease; }
      .card.open .card-body { grid-template-rows: 1fr; }
      .card-inner { overflow: hidden; min-height: 0; }
      .card-pad { margin: 0 16px; padding: 14px 0; border-top: 1px solid var(--line); }

      /* ---------- timeline ---------- */
      .tl { list-style: none; margin: 0; padding: 0; }
      .tl-item { position: relative; }
      .tl-item::before {
        content: ''; position: absolute; z-index: 0;
        inset-inline-start: 14px; top: 34px; bottom: -4px; width: 2px;
        border-radius: 2px; background: var(--line);
      }
      .tl-item.done::before { background: var(--accent); opacity: .55; }
      .tl-item:last-child::before { display: none; }
      .tl-row {
        width: 100%; border: 0; background: transparent; text-align: start;
        display: flex; align-items: center; gap: 12px;
        min-height: 38px; padding: 4px 0; border-radius: 12px;
        position: relative; z-index: 1;
      }
      button.tl-row:hover .tl-node { transform: scale(1.12); border-color: var(--accent); }
      button.tl-row:hover .tl-go { opacity: 1; }
      .tl-node {
        width: 30px; height: 30px; border-radius: 50%; flex: none;
        display: grid; place-items: center;
        font-size: .8rem; font-weight: 700;
        border: 2px solid var(--line); background: var(--glass-strong); color: var(--muted);
        transition: transform .15s, border-color .15s;
      }
      .tl-node svg { width: 15px; height: 15px; }
      .done .tl-node { background: var(--accent); border-color: var(--accent); color: #fff; }
      .cur .tl-node {
        border-color: var(--accent); color: var(--accent); background: var(--glass-strong);
        box-shadow: 0 0 0 5px var(--accent-soft);
      }
      .tl-name { flex: 1; min-width: 0; color: var(--muted); font-size: .95rem; }
      .done .tl-name { color: var(--text); opacity: .75; }
      .cur .tl-name { color: var(--text); font-weight: 700; font-size: 1.02rem; }
      .tl-go { font-size: .75rem; font-weight: 600; color: var(--accent); opacity: 0; transition: opacity .15s; }
      .now {
        font-size: .72rem; font-weight: 700; color: var(--accent);
        background: var(--accent-soft); padding: 2px 9px; border-radius: 99px;
      }
      .tl-detail { padding: 6px 0 14px; padding-inline-start: 42px; position: relative; z-index: 1; }

      .msg {
        padding: 12px 14px; border-radius: 16px;
        background: var(--accent-soft);
      }
      .msg-head {
        display: flex; align-items: center; justify-content: space-between;
        font-size: .78rem; font-weight: 700; color: var(--accent); margin-bottom: 4px;
      }
      .msg p { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .95rem; }
      .copy {
        border: 0; background: var(--glass-strong); color: var(--accent);
        font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 99px;
        display: inline-flex; align-items: center; gap: 5px;
      }
      .copy svg { width: 14px; height: 14px; }
      .msg-form {
        display: flex; align-items: center; gap: 8px;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .9rem;
      }
      .msg-form span { flex: 1; min-width: 0; font-weight: 500; }
      .msg-form > svg { width: 18px; height: 18px; flex: none; color: var(--accent); }

      .actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 12px; }
      .btn {
        border-radius: 14px; padding: 11px 16px; font-weight: 600;
        border: 1px solid var(--line); background: var(--glass-strong);
        transition: transform .1s, opacity .15s, filter .15s;
      }
      .btn:active:not(:disabled) { transform: scale(.97); }
      .btn:disabled { opacity: .4; cursor: default; }
      .btn.primary {
        background: var(--accent); border-color: transparent; color: #fff;
        box-shadow: 0 8px 18px -8px var(--accent);
      }
      .btn.primary:hover { filter: brightness(1.07); }
      .btn.ghost { background: transparent; }
      .btn.go-done { background: var(--green); box-shadow: 0 8px 18px -8px var(--green); }

      .done-banner {
        display: flex; align-items: center; gap: 10px; margin-top: 8px;
        padding: 10px 14px; border-radius: 14px;
        background: var(--green-soft); color: var(--green); font-weight: 600; font-size: .92rem;
      }
      .done-banner span { flex: 1; }
      .done-banner .btn { padding: 6px 12px; font-size: .85rem; color: var(--text); }

      .card-foot {
        display: flex; align-items: center; gap: 8px; margin-top: 6px;
        padding-top: 12px; border-top: 1px dashed var(--line);
      }
      .card-foot .spacer { flex: 1; }
      .download, .del {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: .85rem; font-weight: 600; text-decoration: none;
        padding: 6px 12px; border-radius: 99px; border: 0;
      }
      .download { color: var(--accent); background: var(--accent-soft); }
      .download:hover { filter: brightness(1.05); text-decoration: underline; }
      .del { background: transparent; color: var(--muted); }
      .del:hover { color: var(--danger); background: rgba(220, 38, 38, .08); }
      .download svg, .del svg { width: 16px; height: 16px; }

      .empty {
        text-align: center; color: var(--muted);
        padding: 46px 20px; border-radius: var(--radius);
        border: 2px dashed var(--line);
      }
      .empty .big { font-size: 2.2rem; line-height: 1; margin-bottom: 10px; }
      .empty b { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }

      /* ---------- FAB ---------- */
      .fab {
        position: fixed; z-index: 10;
        left: 50%; transform: translateX(-50%);
        bottom: calc(96px + env(safe-area-inset-bottom));
        border: 0; border-radius: 99px;
        padding: 15px 28px; font-weight: 700; font-size: 1rem;
        background: var(--accent); color: #fff;
        display: flex; align-items: center; gap: 8px;
        box-shadow: 0 14px 30px -10px var(--accent), 0 2px 6px rgba(15, 23, 42, .15);
        transition: transform .12s;
      }
      .fab svg { width: 20px; height: 20px; }
      .fab:active { transform: translateX(-50%) scale(.96); }

      /* ---------- tab bar (מטלות / התנסויות) ---------- */
      .tabbar {
        position: fixed; z-index: 11; left: 50%; transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom));
        width: min(360px, calc(100% - 32px));
        display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
        padding: 5px; border-radius: 22px;
        background: var(--glass-strong);
      }
      .tb-btn {
        border: 0; background: transparent; border-radius: 17px;
        padding: 8px 6px; font-weight: 700; font-size: .92rem; color: var(--muted);
        display: flex; align-items: center; justify-content: center; gap: 7px;
        transition: background .2s, color .2s;
      }
      .tb-btn svg { width: 20px; height: 20px; }
      .tb-btn.active { background: var(--blue-soft); color: var(--blue); }
      .tb-btn .badge {
        min-width: 20px; padding: 0 6px; border-radius: 99px;
        font-size: .72rem; line-height: 19px; background: var(--orange); color: #fff;
      }

      /* ---------- tasks page ---------- */
      .hero-row { display: flex; align-items: flex-start; gap: 10px; }
      .hero-row > div { flex: 1; min-width: 0; }
      .ch-sub .late { color: var(--danger); font-weight: 600; }
      .ch-sub .soon { color: var(--orange); font-weight: 600; }
      .ring-t.small { font-size: .82rem; }
      .place-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .place-tag {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: .82rem; font-weight: 600; padding: 4px 11px; border-radius: 99px;
        background: var(--accent-soft); color: var(--accent);
      }
      .place-tag svg { width: 14px; height: 14px; }
      .wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .wide svg { width: 18px; height: 18px; }
      .sub-head {
        font-size: .8rem; font-weight: 700; color: var(--muted);
        margin: 14px 2px 7px; display: flex; align-items: center; gap: 8px;
      }
      .sub-head .hint { font-weight: 500; opacity: .8; }
      .chip { text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: 5px; }
      .chip svg { width: 14px; height: 14px; }
      .chip.ok { background: var(--green-soft); border-color: transparent; color: var(--green); font-weight: 600; }
      .chip.ok:hover { border-color: var(--green); }
      .chip.miss { border-style: dashed; }
      .none-left { font-size: .9rem; color: var(--green); font-weight: 600; padding: 2px; }
      .copy-btn { background: transparent; color: var(--muted); }
      .copy-btn:hover { color: var(--text); background: var(--line); }
      .copy-btn svg { width: 16px; height: 16px; }

      .sheet { max-height: 92vh; overflow-y: auto; }
      .sheet-sub { margin: -10px 0 16px; color: var(--muted); font-size: .92rem; }
      .chip.place-other { border-style: dashed; }
      .file-drop {
        position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer;
        padding: 14px; border-radius: 14px; border: 2px dashed var(--line); background: var(--glass);
        transition: border-color .15s;
      }
      .file-drop:hover, .file-drop.has { border-color: var(--accent); }
      .file-drop input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
      .file-drop svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
      .file-drop span { flex: 1; min-width: 0; word-break: break-all; font-weight: 500; }
      .link-btn {
        border: 0; background: transparent; padding: 8px 2px 0; font-size: .86rem; font-weight: 600;
        color: var(--accent); text-decoration: underline; text-underline-offset: 3px;
      }
      .warn { font-size: .84rem; color: var(--orange); margin-top: 8px; }
      .btn-spin {
        display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-inline-end: 6px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
        animation: spin .8s linear infinite;
      }

      /* ---------- modal ---------- */
      .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
      .modal-backdrop {
        position: absolute; inset: 0; background: rgba(8, 12, 24, .35);
        -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        animation: fade .2s;
      }
      .sheet {
        position: relative; width: 100%; max-width: 520px;
        background: var(--glass-strong);
        -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
        border: 1px solid var(--glass-border);
        border-radius: 26px 26px 0 0;
        padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
        animation: up .26s cubic-bezier(.2, .9, .3, 1.1);
        box-shadow: 0 -10px 40px rgba(15, 23, 42, .2);
      }
      @media (min-width: 640px) {
        .modal { align-items: center; }
        .sheet { border-radius: 26px; padding-bottom: 20px; }
        .sheet-handle { display: none; }
      }
      .sheet-handle { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
      .sheet h2 { margin: 6px 0 16px; font-size: 1.3rem; font-weight: 800; }
      .field { display: block; margin-bottom: 16px; }
      .label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
      .field input {
        width: 100%; padding: 12px 14px; border-radius: 14px;
        border: 1px solid var(--line); background: var(--glass); outline: none;
      }
      .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 16px; background: var(--line); }
      .type-opt {
        padding: 10px; border-radius: 12px; font-weight: 600; border: 0;
        background: transparent; color: var(--muted); transition: background .2s, color .2s;
      }
      .type-opt.sel { background: var(--glass-strong); color: var(--accent); box-shadow: 0 2px 8px -2px rgba(15, 23, 42, .15); }
      .chip-groups { max-height: 42vh; overflow-y: auto; padding: 2px; margin: 0 -2px; }
      .chip-group { font-size: .76rem; font-weight: 700; color: var(--muted); margin: 14px 2px 6px; }
      .chip-group:first-child { margin-top: 0; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; }
      .chip {
        padding: 7px 14px; border-radius: 99px; font-size: .9rem; font-weight: 500;
        border: 1px solid var(--line); background: var(--glass);
        transition: background .15s, color .15s, border-color .15s;
      }
      .chip:hover { border-color: var(--accent); }
      .chip.sel { border-color: var(--accent); background: var(--accent); color: #fff; }
      .chip.other { border-style: dashed; }
      .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 6px; }

      .forms-list { display: grid; gap: 8px; margin-bottom: 12px; }
      .form-row {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; border-radius: 14px;
        background: var(--glass); border: 1px solid var(--line);
      }
      .form-row span { flex: 1; min-width: 0; font-weight: 500; }
      .form-row > svg { width: 18px; height: 18px; flex: none; color: var(--blue); }
      .file-link {
        flex: none; font-size: .78rem; font-weight: 700; text-decoration: none;
        padding: 4px 11px; border-radius: 99px;
        background: var(--glass-strong); color: var(--accent); border: 1px solid var(--line);
      }
      .form-row .file-link { color: var(--blue); }
      .file-link:hover { border-color: currentColor; }

      @keyframes up { from { transform: translateY(40px); opacity: 0; } }
      @keyframes fade { from { opacity: 0; } }

      /* ---------- toast ---------- */
      .toast {
        position: fixed; z-index: 30; left: 50%; top: 14px;
        transform: translate(-50%, -160%);
        display: flex; align-items: center; gap: 12px;
        background: var(--text); color: var(--bg);
        padding: 9px 10px 9px 18px; border-radius: 99px; font-weight: 600; font-size: .9rem;
        box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .4);
        transition: transform .3s cubic-bezier(.2, .9, .3, 1.2), visibility 0s .3s;
        pointer-events: none; max-width: calc(100% - 32px); visibility: hidden;
      }
      .toast:not(:has(button)) { padding-left: 18px; }
      .toast.show { transform: translate(-50%, 0); pointer-events: auto; visibility: visible; transition-delay: 0s; }
      .toast button {
        border: 0; border-radius: 99px; padding: 4px 12px; font-weight: 700; font-size: .85rem;
        background: rgba(127, 127, 127, .28); color: inherit;
      }

      @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
        *, *::before { transition-duration: 0s !important; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="wrap">
      <div class="center-state"><div class="spinner"></div><p>טוען…</p></div>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-act="close-modal"></div>
      <form class="sheet" id="add-form" autocomplete="off">
        <div class="sheet-handle"></div>
        <h2>התנסות חדשה</h2>
        <div class="field">
          <span class="label">סוג</span>
          <div class="type-pick" id="type-pick"></div>
        </div>
        <div class="field" id="catalog-field">
          <span class="label">התנסות</span>
          <div class="chip-groups" id="catalog-pick"></div>
        </div>
        <label class="field" id="title-field">
          <span class="label">שם ההתנסות</span>
          <input id="add-title" type="text" maxlength="200" placeholder="למשל: שיעור מגילת צה״ל">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn ghost" data-act="close-modal">ביטול</button>
          <button type="submit" class="btn primary">הוספה</button>
        </div>
      </form>
    </div>

    <div id="forms-modal" class="modal" hidden>
      <div class="modal-backdrop" data-act="close-forms"></div>
      <div class="sheet t-0">
        <div class="sheet-handle"></div>
        <h2>טפסים להגשה</h2>
        <div id="forms-list" class="forms-list"></div>
        <div class="sheet-actions" style="grid-template-columns:1fr">
          <button type="button" class="btn ghost" data-act="close-forms">סגירה</button>
        </div>
      </div>
    </div>

    <div id="task-modal" class="modal" hidden>
      <div class="modal-backdrop" data-act="close-task"></div>
      <form class="sheet t-0" id="task-form" autocomplete="off">
        <div class="sheet-handle"></div>
        <h2 id="task-h">מטלה חדשה</h2>
        <label class="field">
          <span class="label">שם המטלה</span>
          <input id="task-title" type="text" maxlength="200" placeholder="למשל: עבודת סיכום פרק א׳">
        </label>
        <label class="field">
          <span class="label">תג״ב</span>
          <input id="task-due" type="date">
        </label>
        <div class="field">
          <span class="label">איפה מגישים? (אפשר לבחור כמה)</span>
          <div class="chips" id="place-pick"></div>
        </div>
        <label class="field" id="other-field" hidden>
          <span class="label">איפה עוד?</span>
          <input id="task-other" type="text" maxlength="200" placeholder="למשל: במייל למפקד הצוות">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn ghost" data-act="close-task">ביטול</button>
          <button type="submit" class="btn primary" id="task-submit">הוספה</button>
        </div>
      </form>
    </div>

    <div id="upload-modal" class="modal" hidden>
      <div class="modal-backdrop" data-act="close-upload"></div>
      <form class="sheet t-0" id="upload-form" autocomplete="off">
        <div class="sheet-handle"></div>
        <h2>העלאה לדרייב</h2>
        <p class="sheet-sub" id="upload-task"></p>
        <div class="field">
          <span class="label">מי מגיש?</span>
          <div class="chips" id="upload-people"></div>
          <div class="warn" id="upload-warn" hidden>כבר הועלה קובץ. העלאה חדשה תחליף אותו.</div>
        </div>
        <div class="field">
          <span class="label">קובץ PDF</span>
          <label class="file-drop" id="file-drop">
            <input type="file" id="upload-file" accept="application/pdf,.pdf">
            <span id="upload-fname">בחירת קובץ…</span>
          </label>
          <button type="button" class="link-btn" data-act="mark-no-file">הגשתי בדרך אחרת, רק לסמן שהגשתי</button>
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn ghost" data-act="close-upload">ביטול</button>
          <button type="submit" class="btn primary" id="upload-btn">העלאה</button>
        </div>
      </form>
    </div>

    <nav id="tabbar" class="tabbar glass" hidden>
      <button class="tb-btn" data-act="page" data-page="tasks"></button>
      <button class="tb-btn" data-act="page" data-page="exp"></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="catalog.js"></script>
    <script>
      const svg = (d, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const ICONS = {
        back: svg('<path d="M9 6l6 6-6 6"/>'),
        refresh: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
        trash: svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'),
        plus: svg('<path d="M12 5v14M5 12h14"/>', 2.5),
        copy: svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
        download: svg('<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>', 2.2),
        doc: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>'),
        check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3),
        chev: svg('<path d="M6 9l6 6 6-6"/>', 2.2),
        tasks: svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11l2 2 4-4"/><path d="M9 17h6"/>'),
        exp: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'),
        upload: svg('<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>', 2.2),
        edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
        cloud: svg('<path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/>'),
        pin: svg('<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'),
        pen: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>')
      };
      const DRIVE = 'דרייב';
      const PLACE_ICON = { 'קמפוס': 'pin', 'דרייב': 'cloud', 'כתב יד': 'pen' };
      const MAX_MB = 20;
      const PLURAL = { 'הדרכתית': 'הדרכתיות', 'פיקודית': 'פיקודיות' };
      const CATALOG = window.CATALOG || [];
      const FORMS = window.FORMS || [];
      const OTHER = '__other__';
      // השוואת שמות סלחנית: מתעלם מסוגי גרשיים ורווחים
      const norm = s => String(s).replace(/[״"׳']/g, '').replace(/\s+/g, ' ').trim();
      function fileFor(title) {
        const c = CATALOG.find(c => c.file && norm(c.name) === norm(title));
        return c ? c.file : null;
      }

      const state = {
        data: null,
        page: 'tasks', // תמיד נפתח על המטלות
        editTask: null,
        taskPlaces: [],
        taskOther: false,
        upTask: null,
        upPerson: null,
        uploading: false,
        person: storeGet('person'),
        tab: storeGet('tab') || 'הדרכתית',
        shownTab: null,
        addType: null,
        pending: 0,
        refreshing: false,
        open: (() => { try { return JSON.parse(storeGet('open') || '{}'); } catch (e) { return {}; } })()
      };

      const app = document.getElementById('app');
      const modal = document.getElementById('modal');
      const form = document.getElementById('add-form');
      const titleInput = document.getElementById('add-title');
      const formsModal = document.getElementById('forms-modal');
      const taskModal = document.getElementById('task-modal');
      const taskForm = document.getElementById('task-form');
      const uploadModal = document.getElementById('upload-modal');
      const uploadForm = document.getElementById('upload-form');
      const fileInput = document.getElementById('upload-file');
      const tabbar = document.getElementById('tabbar');

      // ---------- helpers ----------
      function storeGet(k) { try { return localStorage.getItem('exp:' + k); } catch (e) { return null; } }
      function storeSet(k, v) {
        try { v == null ? localStorage.removeItem('exp:' + k) : localStorage.setItem('exp:' + k, v); } catch (e) {}
      }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function avClass(name) {
        let h = 0;
        for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        return 'av-' + (h % 5);
      }

      // ---------- API (Google Sheets via Apps Script, or local demo) ----------
      const API_URL = (window.CONFIG && window.CONFIG.API_URL || '').trim();

      async function call(fn, ...args) {
        if (!API_URL) return Demo[fn](...args);
        let res;
        if (fn === 'getData') {
          res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
        } else {
          // text/plain avoids a CORS preflight, which Apps Script doesn't support
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: fn, args })
          });
        }
        if (!res.ok) throw new Error('שגיאת רשת (' + res.status + ')');
        const j = await res.json();
        if (j && j.error) throw new Error(j.error);
        return withTasks(j);
      }

      // כשהשרת עוד לא תומך במטלות: מציגים את המטלות ההתחלתיות לקריאה בלבד
      function withTasks(d) {
        if (d && d.people && !('assignments' in d)) {
          d.assignments = seedTasks('seed-');
          d.submissions = [];
          d.tasksLocked = true;
        }
        return d;
      }
      function seedTasks(prefix) {
        return (window.TASKS_SEED || []).map((t, i) => ({
          id: prefix + i, title: t.title, due: t.due, places: t.places.slice(), other: t.other || '', created: String(i)
        }));
      }

      // קפיצה לשלב. אם ה-Apps Script עוד לא עודכן עם setStage, מתקדמים צעד-צעד
      async function setStageRemote(id, target) {
        try {
          return await call('setStage', id, target);
        } catch (e) {
          if (!/לא מוכרת/.test((e && e.message) || '')) throw e;
          let d = await call('getData');
          for (let i = 0; i < 12; i++) {
            const x = d.experiences.find(x => x.id === id);
            if (!x || x.stage === target) break;
            d = await call('moveStage', id, target > x.stage ? 1 : -1);
          }
          return d;
        }
      }

      // מצב הדגמה: כשאין API_URL, הנתונים נשמרים בדפדפן בלבד
      const Demo = (() => {
        const TYPES = ['הדרכתית', 'פיקודית'];
        const DEF = [
          ['הורדת התנסות', 'קיבלת את ההתנסות "{התנסות}".\nעכשיו צריך למלא את טופס אישור התוכניות ולהעלות אותו לקמפוס תוך 24 שעות (או בזמן שנקבע להתנסות).\nאת הפורמט אפשר להוריד כאן למטה.'],
          ['אישור תוכניות', 'הטופס הועלה ונמצא בבדיקה.\nעכשיו צריך לעבור על ההערות, לחדד ולדייק את התוכניות, ולוודא שהגרסה הסופית בקמפוס ותקינה עד שהמפק"ץ מאשר.'],
          ['ביצוע ההתנסות', 'התוכניות אושרו.\nעכשיו צריך להתכונן ולבצע את ההתנסות לפי התוכנית שאושרה.'],
          ['משוב חם של הצוות', 'מיד בסוף ההתנסות צריך לקיים משוב חם עם הצוות.\nלהקפיד שהמשוב יהיה איכותי, ולשים לב לנקודות שיעזרו בכתיבת התחקור.'],
          ['כתיבת דף תחקור עצמי', 'עכשיו צריך לכתוב דף תחקור עצמי ולהגיש אותו בקמפוס עד 24 שעות מסיום ההתנסות.\nכדאי להעמיק בו, כי הוא הבסיס למשוב עם המפק"ץ.\nאת הפורמט אפשר להוריד כאן למטה.'],
          ['משוב מהמפק"ץ', 'עכשיו צריך לתאם משוב עם המפק"ץ ולהגיע אליו עם דף התחקור.\nאחרי המשוב אפשר לסמן את ההתנסות כהושלמה.']
        ];
        const stages = {};
        TYPES.forEach(t => { stages[t] = DEF.map((s, i) => ({ num: i + 1, name: s[0], message: s[1] })); });
        const people = [1, 2, 3, 4, 5].map(i => 'חניך ' + i);
        let exps;
        try { exps = JSON.parse(localStorage.getItem('exp:demo') || '[]'); } catch (e) { exps = []; }
        let tasks, subs;
        try { tasks = JSON.parse(localStorage.getItem('exp:demo-tasks') || 'null'); } catch (e) { tasks = null; }
        if (!Array.isArray(tasks)) tasks = seedTasks('d-seed-');
        try { subs = JSON.parse(localStorage.getItem('exp:demo-subs') || '[]'); } catch (e) { subs = []; }
        const save = () => {
          try {
            localStorage.setItem('exp:demo', JSON.stringify(exps));
            localStorage.setItem('exp:demo-tasks', JSON.stringify(tasks));
            localStorage.setItem('exp:demo-subs', JSON.stringify(subs));
          } catch (e) {}
        };
        const PLACES = ['קמפוס', 'דרייב', 'כתב יד'];
        const snap = () => JSON.parse(JSON.stringify({
          people, types: TYPES, stages, experiences: exps, places: PLACES, assignments: tasks, submissions: subs
        }));
        const setSub = (aid, person, mode, on) => {
          subs = subs.filter(s => !(s.aid === aid && s.person === person));
          if (on) subs.push({ aid, person, mode, url: '', time: new Date().toISOString() });
        };
        const delay = v => new Promise(r => setTimeout(() => r(v), 150));
        const setTo = (x, s) => { x.stage = Math.min(stages[x.type].length + 1, Math.max(1, s)); x.updated = new Date().toISOString(); };
        return {
          getData: () => delay(snap()),
          addExperience(person, type, title) {
            const now = new Date().toISOString();
            exps.push({ id: 'd' + Date.now(), person, type, title, stage: 1, created: now, updated: now });
            save(); return delay(snap());
          },
          moveStage(id, d) {
            const x = exps.find(e => e.id === id);
            if (x) setTo(x, x.stage + (d > 0 ? 1 : -1));
            save(); return delay(snap());
          },
          setStage(id, s) {
            const x = exps.find(e => e.id === id);
            if (x) setTo(x, Math.round(Number(s)) || 1);
            save(); return delay(snap());
          },
          deleteExperience(id) { exps = exps.filter(e => e.id !== id); save(); return delay(snap()); },
          addAssignment(title, due, places, other) {
            tasks.push({ id: 'd' + Date.now(), title, due, places, other, created: new Date().toISOString() });
            save(); return delay(snap());
          },
          updateAssignment(id, title, due, places, other) {
            const t = tasks.find(t => t.id === id);
            if (t) Object.assign(t, { title, due, places, other });
            save(); return delay(snap());
          },
          deleteAssignment(id) {
            tasks = tasks.filter(t => t.id !== id); subs = subs.filter(s => s.aid !== id);
            save(); return delay(snap());
          },
          setSubmitted(aid, person, on) { setSub(aid, person, 'manual', on); save(); return delay(snap()); },
          // במצב הדגמה אין דרייב: רק נרשם שהוגש
          uploadSubmission(aid, person) { setSub(aid, person, 'upload', true); save(); return new Promise(r => setTimeout(() => r(snap()), 900)); }
        };
      })();

      // ---------- toast (עם כפתור פעולה אופציונלי, למשל "ביטול") ----------
      let toastTimer, toastAction = null;
      function toast(text, action) {
        const t = document.getElementById('toast');
        toastAction = action || null;
        t.innerHTML = `<span>${esc(text)}</span>` + (action ? `<button type="button" data-act="toast-act">${esc(action.label)}</button>` : '');
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, action ? 4500 : 2200);
      }
      function hideToast() { document.getElementById('toast').classList.remove('show'); toastAction = null; }

      function typeIdx(type) { return Math.max(0, state.data.types.indexOf(type)); }
      function stagesOf(type) { return state.data.stages[type] || []; }
      function isDone(exp) { return exp.stage > stagesOf(exp.type).length; }
      function findExp(id) { return state.data.experiences.find(x => x.id === id); }
      function isOpen(x) {
        if (x.id in state.open) return state.open[x.id];
        return 'stage' in x ? !isDone(x) : !allIn(x);
      }
      function fillMessage(msg, exp) {
        return msg.replace(/\{שם\}/g, exp.person).replace(/\{התנסות\}/g, exp.title);
      }
      function initials(name) {
        const parts = name.trim().split(/\s+/);
        return parts.length > 1 ? parts[0][0] + parts[1][0] : name.slice(0, 2);
      }

      // ---------- data ----------
      async function refresh(silent) {
        if (state.refreshing) return;
        state.refreshing = true;
        if (silent) setRefreshSpin(true);
        try {
          const d = await call('getData');
          if (state.pending === 0) { state.data = d; render(); }
        } catch (e) {
          if (!state.data) renderError(e);
          else toast('הרענון נכשל');
        } finally {
          state.refreshing = false;
          setRefreshSpin(false);
        }
      }
      function setRefreshSpin(on) {
        const b = document.querySelector('[data-act="refresh"]');
        if (b) b.classList.toggle('spinning', on);
      }

      // שינויים נשלחים לשרת בתור, אחד אחרי השני, כדי ש"ביטול" תמיד יגיע אחרי הפעולה שהוא מבטל
      let queue = Promise.resolve();
      function mutate(run, optimistic, msg, action) {
        const snapshot = JSON.stringify(state.data);
        optimistic();
        render();
        if (msg) toast(msg, action);
        state.pending++;
        const p = queue.then(run);
        queue = p.catch(() => {});
        p.then(d => {
          state.pending--;
          if (state.pending === 0) { state.data = d; render(); }
        }, e => {
          state.pending--;
          state.data = JSON.parse(snapshot);
          render();
          toast((e && e.message) ? 'שגיאה: ' + e.message : 'השמירה נכשלה, נסה שוב');
        });
      }

      function goStage(id, target, isUndo) {
        const exp = findExp(id);
        if (!exp) return;
        if (String(id).startsWith('tmp-')) return toast('רגע, עדיין שומר…');
        const n = stagesOf(exp.type).length;
        target = Math.min(n + 1, Math.max(1, target));
        const prev = exp.stage;
        if (target === prev) return;
        const delta = target - prev;
        const run = Math.abs(delta) === 1 ? () => call('moveStage', id, delta) : () => setStageRemote(id, target);
        const msg = isUndo ? 'בוטל'
          : target > n ? 'כל הכבוד! ההתנסות הושלמה 🎉'
          : 'עברת לשלב ' + target + ': ' + stagesOf(exp.type)[target - 1].name;
        mutate(run, () => {
          const x = findExp(id);
          if (x) { x.stage = target; x.updated = new Date().toISOString(); }
        }, msg, isUndo ? null : { label: 'ביטול', fn: () => goStage(id, prev, true) });
      }

      // ---------- render ----------
      function render() {
        if (!state.data) return;
        renderTabbar();
        if (state.page === 'tasks') renderTasks();
        else if (!state.person || state.data.people.indexOf(state.person) === -1) renderPeople();
        else renderPerson();
      }

      function renderTabbar() {
        const open = tasksOf().filter(t => !allIn(t)).length;
        const [bt, be] = tabbar.querySelectorAll('.tb-btn');
        bt.innerHTML = `${ICONS.tasks} מטלות${open ? ` <span class="badge">${open}</span>` : ''}`;
        be.innerHTML = `${ICONS.exp} התנסויות`;
        bt.classList.toggle('active', state.page === 'tasks');
        be.classList.toggle('active', state.page === 'exp');
        tabbar.hidden = false;
      }

      // ---------- tasks (מטלות) ----------
      function tasksOf() { return state.data.assignments || []; }
      function findTask(id) { return tasksOf().find(t => t.id === id); }
      function hasDrive(t) { return t.places.indexOf(DRIVE) !== -1; }
      function subsOf(aid) { return (state.data.submissions || []).filter(s => s.aid === aid); }
      function subFor(aid, person) { return subsOf(aid).find(s => s.person === person); }
      function submittedPeople(t) {
        const set = new Set(subsOf(t.id).map(s => s.person));
        return state.data.people.filter(p => set.has(p));
      }
      function allIn(t) {
        const n = state.data.people.length;
        return n > 0 && submittedPeople(t).length >= n;
      }
      function parseDue(due) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(due || '');
        return m ? new Date(+m[1], m[2] - 1, +m[3]) : null;
      }
      // "תג״ב 3.12 · עוד 3 ימים", עם צבע כשקרוב או באיחור
      function dueHtml(t) {
        const d = parseDue(t.due);
        if (!d) return 'ללא תג״ב';
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const days = Math.round((d - today) / 864e5);
        const date = `תג״ב ${d.getDate()}.${d.getMonth() + 1}`;
        let rel, cls = '';
        if (days === 0) { rel = 'היום'; cls = 'soon'; }
        else if (days === 1) { rel = 'מחר'; cls = 'soon'; }
        else if (days > 1) { rel = `עוד ${days} ימים`; if (days <= 3) cls = 'soon'; }
        else { rel = days === -1 ? 'באיחור של יום' : `באיחור של ${-days} ימים`; cls = 'late'; }
        if (allIn(t)) cls = '';
        return `${date} · <span class="${cls}">${rel}</span>`;
      }
      function placeNames(t) { return t.places.concat(t.other ? [t.other] : []); }
      function placeText(t) { const p = placeNames(t); return p.length ? p.join(', ') : 'מקום הגשה לא נקבע'; }

      function renderTasks() {
        const d = state.data;
        const list = tasksOf().slice().sort((a, b) =>
          (a.due || '9999').localeCompare(b.due || '9999') || (a.created || '').localeCompare(b.created || ''));
        const open = list.filter(t => !allIn(t));
        const done = list.filter(allIn);
        const locked = !!d.tasksLocked;

        let body;
        if (!list.length) {
          body = `<div class="empty"><div class="big">✦</div><b>אין עדיין מטלות</b>לחצו על "מטלה חדשה" כדי להוסיף</div>`;
        } else {
          body = (open.length && done.length ? `<div class="section-title">פתוחות (${open.length})</div>` : '')
            + open.map(taskCardHtml).join('');
          if (done.length) body += `<div class="section-title">כולם הגישו (${done.length})</div>` + done.map(taskCardHtml).join('');
        }

        app.innerHTML = `
          <div class="hero hero-row">
            <div>
              <span class="eyebrow">הגשות</span>
              <h1>מטלות</h1>
              <p>${open.length ? open.length + ' מטלות פתוחות' : list.length ? 'כולם הגישו הכול 🎉' : 'מה צריך להגיש ועד מתי'}</p>
              ${API_URL ? '' : '<p class="demo-note">מצב הדגמה: הנתונים נשמרים רק בדפדפן הזה, וקבצים לא עולים לדרייב.</p>'}
              ${locked ? '<p class="demo-note">העלאת מטלות וסימון הגשות יתאפשרו בהמשך.</p>' : ''}
              ${d.driveFolder ? `<a class="pill-btn glass" style="text-decoration:none" href="${esc(d.driveFolder)}" target="_blank" rel="noopener">${ICONS.cloud} תיקיית ההגשות בדרייב</a>` : ''}
            </div>
            <button class="icon-btn glass" data-act="refresh" title="רענון" aria-label="רענון">${ICONS.refresh}</button>
          </div>
          <div class="list t-0">${body}</div>
          ${locked ? '' : `<button class="fab t-0" data-act="add-task">${ICONS.plus} מטלה חדשה</button>`}`;
        setRefreshSpin(state.refreshing);
      }

      function taskCardHtml(t) {
        const people = state.data.people;
        const total = people.length;
        const inSet = new Set(submittedPeople(t));
        const count = inSet.size;
        const done = allIn(t);
        const open = isOpen(t);
        const id = esc(t.id);
        const drive = hasDrive(t);
        const missing = people.filter(p => !inSet.has(p));
        const submitted = people.filter(p => inSet.has(p));

        const pct = total ? Math.round(count / total * 100) : 0;
        const ring = `<span class="ring" aria-hidden="true"><svg viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15.9155"/>
            ${pct ? `<circle class="ring-fg" cx="18" cy="18" r="15.9155" stroke-dasharray="${pct} 100"/>` : ''}
          </svg><span class="ring-t small">${done ? ICONS.check : count + '/' + total}</span></span>`;

        const locked = !!state.data.tasksLocked;
        const tags = placeNames(t).map(p =>
          `<span class="place-tag">${PLACE_ICON[p] ? ICONS[PLACE_ICON[p]] : ''}${esc(p)}</span>`).join('')
          || `<span class="place-tag">${esc(placeText(t))}</span>`;

        // לא הגישו: בדרייב → לחיצה פותחת העלאה בשם הזה; אחרת → לחיצה מסמנת שהגיש
        const missChips = missing.map(p => drive
          ? `<button class="chip miss" data-act="upload" data-id="${id}" data-name="${esc(p)}" title="העלאה בשם ${esc(p)}">${esc(p)}</button>`
          : `<button class="chip miss" data-act="toggle-sub" data-id="${id}" data-name="${esc(p)}" title="סימון שהגיש/ה">${esc(p)}</button>`
        ).join('');
        // הגישו: קובץ שהועלה → קישור לקובץ; סימון ידני → לחיצה מבטלת
        const okChips = submitted.map(p => {
          const s = subFor(t.id, p);
          if (s && s.mode === 'upload') {
            return s.url
              ? `<a class="chip ok" href="${esc(s.url)}" target="_blank" rel="noopener" title="פתיחת הקובץ">${ICONS.check}${esc(p)}</a>`
              : `<span class="chip ok">${ICONS.check}${esc(p)}</span>`;
          }
          return `<button class="chip ok" data-act="toggle-sub" data-id="${id}" data-name="${esc(p)}" title="ביטול הסימון">${ICONS.check}${esc(p)}</button>`;
        }).join('');

        return `
          <article class="card glass ${done ? 'done' : ''} ${open ? 'open' : ''}" data-card="${id}">
            <button class="card-head" data-act="toggle" data-id="${id}" aria-expanded="${open}">
              ${ring}
              <span class="ch-text"><h3>${esc(t.title)}</h3>
                <span class="ch-sub">${dueHtml(t)} · ${esc(placeText(t))}</span></span>
              <span class="chev">${ICONS.chev}</span>
            </button>
            <div class="card-body"><div class="card-inner"><div class="card-pad">
              <div class="place-tags">${tags}</div>
              ${drive && !locked ? `<button class="btn primary wide" data-act="upload" data-id="${id}">${ICONS.upload} העלאת PDF לדרייב</button>` : ''}
              <div class="sub-head">לא הגישו (${missing.length})
                ${missing.length && !locked ? `<span class="hint">· ${drive ? 'לחיצה על שם פותחת העלאה' : 'לחיצה על שם מסמנת שהגיש/ה'}</span>` : ''}</div>
              ${missing.length ? `<div class="chips">${missChips}</div>` : '<div class="none-left">כולם הגישו 🎉</div>'}
              ${submitted.length ? `<div class="sub-head">הגישו (${submitted.length})</div><div class="chips">${okChips}</div>` : ''}
              <div class="card-foot" style="margin-top:14px">
                ${missing.length ? `<button class="del copy-btn" data-act="copy-missing" data-id="${id}">${ICONS.copy} העתקת רשימה</button>` : ''}
                <span class="spacer"></span>
                ${locked ? '' : `<button class="del copy-btn" data-act="edit-task" data-id="${id}">${ICONS.edit} עריכה</button>
                <button class="del" data-act="del-task" data-id="${id}">${ICONS.trash} מחיקה</button>`}
              </div>
            </div></div></div>
          </article>`;
      }

      function toggleSub(aid, person, on, isUndo) {
        if (String(aid).startsWith('tmp-')) return toast('רגע, עדיין שומר…');
        mutate(() => call('setSubmitted', aid, person, on), () => {
          state.data.submissions = (state.data.submissions || []).filter(s => !(s.aid === aid && s.person === person));
          if (on) state.data.submissions.push({ aid, person, mode: 'manual', url: '', time: new Date().toISOString() });
        }, isUndo ? 'בוטל' : on ? `סומנה הגשה של ${person}` : `הוסר הסימון של ${person}`,
        isUndo ? null : { label: 'ביטול', fn: () => toggleSub(aid, person, !on, true) });
      }

      function renderError(e) {
        app.innerHTML = `<div class="center-state">
          <p><b>לא הצלחנו לטעון את הנתונים</b></p>
          <p>${esc((e && e.message) || '')}</p>
          <button class="btn primary" data-act="retry">נסה שוב</button></div>`;
      }

      function renderPeople() {
        const active = {};
        state.data.experiences.forEach(x => { if (!isDone(x)) active[x.person] = (active[x.person] || 0) + 1; });
        app.innerHTML = `
          <div class="hero">
            <span class="eyebrow">מעגל החניכה</span>
            <h1>מעקב התנסויות</h1>
            <p>בחר/י שם כדי לראות את ההתנסויות</p>
            ${API_URL ? '' : '<p class="demo-note">מצב הדגמה: הנתונים נשמרים רק בדפדפן הזה. כדי לסנכרן, הגדירו API_URL בקובץ config.js</p>'}
            <button class="pill-btn glass" data-act="forms">${ICONS.doc} טפסים להגשה</button>
          </div>
          <div class="people">
            ${state.data.people.map(p => `
              <button class="person glass" data-act="pick" data-name="${esc(p)}">
                <span class="avatar ${avClass(p)}">${esc(initials(p))}</span>
                <span class="name">${esc(p)}</span>
                <span class="meta"><span class="dot ${active[p] ? 'on' : ''}"></span>${active[p] ? active[p] + ' פעילות' : 'אין פעילות'}</span>
              </button>`).join('')}
          </div>`;
      }

      function renderPerson() {
        const d = state.data;
        if (d.types.indexOf(state.tab) === -1) state.tab = d.types[0];
        const mine = d.experiences.filter(x => x.person === state.person);
        const tabIdx = typeIdx(state.tab);
        const counts = {};
        d.types.forEach(t => counts[t] = mine.filter(x => x.type === t && !isDone(x)).length);

        const list = mine.filter(x => x.type === state.tab)
          .sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
        const active = list.filter(x => !isDone(x));
        const done = list.filter(isDone);

        let body;
        if (!list.length) {
          body = `<div class="empty"><div class="big">✦</div><b>אין עדיין התנסויות ${esc(PLURAL[state.tab] || state.tab)}</b>לחצו על "התנסות חדשה" כדי להוסיף</div>`;
        } else {
          body = (active.length && done.length ? `<div class="section-title">בתהליך (${active.length})</div>` : '')
            + active.map(cardHtml).join('');
          if (done.length) body += `<div class="section-title">הושלמו (${done.length})</div>` + done.map(cardHtml).join('');
        }

        // הפס של הלשוניות מתחיל במיקום הקודם ומחליק למיקום החדש
        const fromIdx = state.shownTab != null ? typeIdx(state.shownTab) : tabIdx;
        state.shownTab = state.tab;
        const activeCount = mine.filter(x => !isDone(x)).length;

        app.innerHTML = `
          <div class="topbar">
            <button class="icon-btn glass" data-act="switch" title="החלפת שם" aria-label="החלפת שם">${ICONS.back}</button>
            <span class="avatar ${avClass(state.person)}">${esc(initials(state.person))}</span>
            <div style="flex:1;min-width:0">
              <h1>${esc(state.person)}</h1>
              <p class="sub">${activeCount ? activeCount + ' התנסויות בתהליך' : 'אין התנסויות בתהליך'}</p>
            </div>
            <button class="icon-btn glass" data-act="forms" title="טפסים להגשה" aria-label="טפסים להגשה">${ICONS.doc}</button>
            <button class="icon-btn glass" data-act="refresh" title="רענון" aria-label="רענון">${ICONS.refresh}</button>
          </div>
          <div class="seg glass">
            <span class="seg-ind" style="--i:${fromIdx}"></span>
            ${d.types.map((t, i) => `
              <button class="tab t-${i} ${t === state.tab ? 'active' : ''}" data-act="tab" data-type="${esc(t)}">
                ${esc(PLURAL[t] || t)} <span class="count">${counts[t]}</span>
              </button>`).join('')}
          </div>
          <div class="list t-${tabIdx}">${body}</div>
          <button class="fab t-${tabIdx}" data-act="add">${ICONS.plus} התנסות חדשה</button>`;
        if (fromIdx !== tabIdx) {
          const ind = app.querySelector('.seg-ind');
          ind.getBoundingClientRect();
          ind.style.setProperty('--i', tabIdx);
        }
        setRefreshSpin(state.refreshing);
      }

      function ringHtml(x, n, done) {
        const pct = done ? 100 : Math.round((x.stage - 1) / n * 100);
        return `<span class="ring" aria-hidden="true"><svg viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15.9155"/>
            ${pct ? `<circle class="ring-fg" cx="18" cy="18" r="15.9155" stroke-dasharray="${pct} 100"/>` : ''}
          </svg><span class="ring-t">${done ? ICONS.check : x.stage}</span></span>`;
      }

      function cardHtml(x) {
        const stages = stagesOf(x.type);
        const n = stages.length;
        const done = isDone(x);
        const cur = stages[x.stage - 1];
        const open = isOpen(x);
        const id = esc(x.id);

        const sub = done
          ? `<b>הושלמה</b> · כל ${n} השלבים`
          : `שלב ${x.stage} מתוך ${n} · <b>${esc(cur ? cur.name : '')}</b>`;

        const timeline = stages.map((s, i) => {
          const k = i + 1;
          const cls = k < x.stage ? 'done' : k === x.stage ? 'cur' : 'todo';
          const node = `<span class="tl-node">${cls === 'done' ? ICONS.check : k}</span>`;
          if (cls === 'cur') {
            return `<li class="tl-item cur">
                <div class="tl-row">${node}<span class="tl-name">${esc(s.name)}</span><span class="now">עכשיו</span></div>
                <div class="tl-detail">${currentHtml(x, s, k, n)}</div>
              </li>`;
          }
          return `<li class="tl-item ${cls}">
              <button class="tl-row" data-act="jump" data-id="${id}" data-s="${k}" title="מעבר לשלב הזה">
                ${node}<span class="tl-name">${esc(s.name)}</span>
                <span class="tl-go">${cls === 'done' ? 'חזרה לכאן' : 'דילוג לכאן'}</span>
              </button>
            </li>`;
        }).join('');

        const file = fileFor(x.title);
        return `
          <article class="card glass ${done ? 'done' : ''} ${open ? 'open' : ''}" data-card="${id}">
            <button class="card-head" data-act="toggle" data-id="${id}" aria-expanded="${open}">
              ${ringHtml(x, n, done)}
              <span class="ch-text"><h3>${esc(x.title)}</h3><span class="ch-sub">${sub}</span></span>
              <span class="chev">${ICONS.chev}</span>
            </button>
            <div class="card-body"><div class="card-inner"><div class="card-pad">
              <ol class="tl">${timeline}</ol>
              ${done ? `<div class="done-banner">${ICONS.check.replace('<svg', '<svg width="20" height="20"')}<span>כל הכבוד, ההתנסות הושלמה</span>
                <button class="btn" data-act="jump" data-id="${id}" data-s="${n}">→ החזרה לשלב ${n}</button></div>` : ''}
              <div class="card-foot">
                ${file ? `<a class="download" href="${esc(encodeURI(file))}" download>${ICONS.download} הורדת התנסות</a>` : ''}
                <span class="spacer"></span>
                <button class="del" data-act="del" data-id="${id}">${ICONS.trash} מחיקה</button>
              </div>
            </div></div></div>
          </article>`;
      }

      function currentHtml(x, s, k, n) {
        const msg = fillMessage(s.message || '', x);
        const forms = formsFor(x);
        const last = k === n;
        const id = esc(x.id);
        return `
          ${msg || forms.length ? `<div class="msg">
            ${msg ? `<div class="msg-head"><span>מה עושים עכשיו</span>
              <button class="copy" data-act="copy" data-id="${id}">${ICONS.copy} העתקה</button></div>
            <p>${esc(msg)}</p>` : ''}
            ${forms.map(f => `<div class="msg-form">${ICONS.doc}<span>${esc(f.name)}</span>${fileLinks(f)}</div>`).join('')}
          </div>` : ''}
          <div class="actions">
            <button class="btn ghost" data-act="move" data-id="${id}" data-d="-1" ${k <= 1 ? 'disabled' : ''} title="שלב קודם" aria-label="שלב קודם">→</button>
            <button class="btn primary ${last ? 'go-done' : ''}" data-act="move" data-id="${id}" data-d="1">
              ${last ? '✓ סיום התנסות' : 'סיימתי, לשלב הבא ←'}</button>
          </div>`;
      }

      function toggleCard(id) {
        const x = findExp(id) || findTask(id);
        const el = app.querySelector(`[data-card="${CSS.escape(id)}"]`);
        if (!x || !el) return;
        const open = !isOpen(x);
        state.open[id] = open;
        // שומרים רק כרטיסים שעדיין קיימים
        const ids = new Set(state.data.experiences.map(e => e.id).concat(tasksOf().map(t => t.id)));
        Object.keys(state.open).forEach(k => { if (!ids.has(k)) delete state.open[k]; });
        storeSet('open', JSON.stringify(state.open));
        el.classList.toggle('open', open);
        el.querySelector('.card-head').setAttribute('aria-expanded', open);
      }

      // ---------- modal ----------
      function openModal() {
        state.addType = state.tab;
        state.addChoice = null;
        titleInput.value = '';
        renderTypePick();
        modal.hidden = false;
      }
      function closeModal() { modal.hidden = true; }
      function renderTypePick() {
        const i = typeIdx(state.addType);
        form.className = 'sheet t-' + i;
        document.getElementById('type-pick').innerHTML = state.data.types.map((t, j) =>
          `<button type="button" class="type-opt t-${j} ${t === state.addType ? 'sel' : ''}" data-act="pick-type" data-type="${esc(t)}">${esc(t)}</button>`
        ).join('');
        const options = CATALOG.filter(c => !c.type || c.type === state.addType);
        document.getElementById('catalog-field').hidden = !options.length;
        const groups = [];
        options.forEach(c => {
          let g = groups.find(g => g.name === (c.group || ''));
          if (!g) groups.push(g = { name: c.group || '', items: [] });
          g.items.push(c);
        });
        const chip = (name, label, cls) =>
          `<button type="button" class="chip ${cls || ''}" data-act="pick-cat" data-name="${esc(name)}">${esc(label)}</button>`;
        const box = document.getElementById('catalog-pick');
        box.innerHTML = groups.map(g =>
          (g.name ? `<div class="chip-group">${esc(g.name)}</div>` : '') +
          `<div class="chips">${g.items.map(c => chip(c.name, c.name)).join('')}</div>`
        ).join('') + `<div class="chips" style="margin-top:12px">${chip(OTHER, 'אחר (שם חופשי)…', 'other')}</div>`;
        box.scrollTop = 0;
        updateChoice(!options.length);
      }
      // סימון הבחירה בלי לבנות מחדש את הרשימה (כדי לא לאבד את מיקום הגלילה)
      function updateChoice(noOptions) {
        document.querySelectorAll('#catalog-pick .chip').forEach(b =>
          b.classList.toggle('sel', b.dataset.name === state.addChoice));
        // שדה טקסט חופשי: כשאין רשימה לסוג הזה, או כשנבחר "אחר"
        const free = noOptions || state.addChoice === OTHER;
        document.getElementById('title-field').hidden = !free;
        if (free) setTimeout(() => titleInput.focus(), 50);
      }

      // ---------- forms ----------
      function fileLinks(f) {
        return f.files.map(x =>
          `<a class="file-link" href="${esc(encodeURI(x.file))}" download>${esc(x.label)}</a>`).join('');
      }
      function formsFor(x) {
        const c = CATALOG.find(c => norm(c.name) === norm(x.title));
        const kind = c && c.group === 'סיורים' ? 'סיורים' : x.type;
        return FORMS.filter(f => f.stages.indexOf(x.stage) !== -1 && (!f.for.length || f.for.indexOf(kind) !== -1));
      }
      function openForms() {
        document.getElementById('forms-list').innerHTML = FORMS.map(f =>
          `<div class="form-row">${ICONS.doc}<span>${esc(f.name)}</span>${fileLinks(f)}</div>`).join('');
        formsModal.hidden = false;
      }

      form.addEventListener('submit', e => {
        e.preventDefault();
        const free = !document.getElementById('title-field').hidden;
        const title = free ? titleInput.value.trim() : (state.addChoice || '');
        if (!title) { free ? titleInput.focus() : toast('בחרו התנסות מהרשימה'); return; }
        const type = state.addType, person = state.person;
        closeModal();
        state.tab = type; storeSet('tab', type);
        const now = new Date().toISOString();
        mutate(() => call('addExperience', person, type, title), () => {
          state.data.experiences.push({ id: 'tmp-' + Date.now(), person, type, title, stage: 1, created: now, updated: now });
        }, 'ההתנסות נוספה');
      });

      // ---------- copy ----------
      async function copyText(text, msg) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        toast(msg || 'ההודעה הועתקה');
      }

      // ---------- task modal (הוספה / עריכה) ----------
      function placeOptions() { return (state.data && state.data.places) || ['קמפוס', DRIVE, 'כתב יד']; }
      function openTaskModal(t) {
        state.editTask = t ? t.id : null;
        document.getElementById('task-h').textContent = t ? 'עריכת מטלה' : 'מטלה חדשה';
        document.getElementById('task-submit').textContent = t ? 'שמירה' : 'הוספה';
        document.getElementById('task-title').value = t ? t.title : '';
        document.getElementById('task-due').value = t ? t.due : '';
        document.getElementById('task-other').value = t ? t.other : '';
        state.taskPlaces = t ? t.places.slice() : [];
        state.taskOther = !!(t && t.other);
        renderPlacePick();
        taskModal.hidden = false;
        if (!t) setTimeout(() => document.getElementById('task-title').focus(), 50);
      }
      function closeTaskModal() { taskModal.hidden = true; }
      function renderPlacePick() {
        document.getElementById('place-pick').innerHTML = placeOptions().map(p =>
          `<button type="button" class="chip ${state.taskPlaces.indexOf(p) !== -1 ? 'sel' : ''}" data-act="pick-place" data-p="${esc(p)}">${PLACE_ICON[p] ? ICONS[PLACE_ICON[p]] : ''}${esc(p)}</button>`
        ).join('') + `<button type="button" class="chip place-other ${state.taskOther ? 'sel' : ''}" data-act="pick-place" data-p="">אחר…</button>`;
        document.getElementById('other-field').hidden = !state.taskOther;
      }

      taskForm.addEventListener('submit', e => {
        e.preventDefault();
        const titleEl = document.getElementById('task-title');
        const title = titleEl.value.trim();
        const due = document.getElementById('task-due').value;
        const places = placeOptions().filter(p => state.taskPlaces.indexOf(p) !== -1);
        const other = state.taskOther ? document.getElementById('task-other').value.trim() : '';
        if (!title) { titleEl.focus(); return toast('חסר שם מטלה'); }
        if (state.taskOther && !other) { document.getElementById('task-other').focus(); return toast('כתבו איפה עוד מגישים'); }
        if (!places.length && !other) return toast('בחרו לפחות מקום הגשה אחד');
        const editId = state.editTask;
        if (editId && String(editId).startsWith('tmp-')) return toast('רגע, עדיין שומר…');
        closeTaskModal();
        if (editId) {
          mutate(() => call('updateAssignment', editId, title, due, places, other), () => {
            const t = findTask(editId);
            if (t) Object.assign(t, { title, due, places, other });
          }, 'המטלה עודכנה');
        } else {
          mutate(() => call('addAssignment', title, due, places, other), () => {
            if (!state.data.assignments) state.data.assignments = [];
            state.data.assignments.push({ id: 'tmp-' + Date.now(), title, due, places, other, created: new Date().toISOString() });
          }, 'המטלה נוספה');
        }
      });

      // ---------- upload modal ----------
      function openUpload(t, person) {
        if (String(t.id).startsWith('tmp-')) return toast('רגע, עדיין שומר…');
        state.upTask = t.id;
        const me = storeGet('me');
        state.upPerson = person || (state.data.people.indexOf(me) !== -1 ? me : null);
        document.getElementById('upload-task').textContent = t.title;
        fileInput.value = '';
        updateFileLabel();
        renderUploadPeople();
        setUploadBusy(false);
        uploadModal.hidden = false;
      }
      function closeUpload() { if (!state.uploading) uploadModal.hidden = true; }
      function renderUploadPeople() {
        const t = findTask(state.upTask);
        if (!t) return;
        document.getElementById('upload-people').innerHTML = state.data.people.map(p =>
          `<button type="button" class="chip ${p === state.upPerson ? 'sel' : ''}" data-act="up-person" data-name="${esc(p)}">${subFor(t.id, p) ? ICONS.check : ''}${esc(p)}</button>`
        ).join('');
        document.getElementById('upload-warn').hidden = !(state.upPerson && subFor(t.id, state.upPerson));
      }
      function updateFileLabel() {
        const f = fileInput.files[0];
        document.getElementById('upload-fname').textContent = f ? f.name : 'בחירת קובץ…';
        document.getElementById('file-drop').classList.toggle('has', !!f);
      }
      function setUploadBusy(on) {
        state.uploading = on;
        const b = document.getElementById('upload-btn');
        b.disabled = on;
        b.innerHTML = on ? '<span class="btn-spin"></span>מעלה…' : 'העלאה';
      }
      function readBase64(file) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(String(r.result).split(',')[1] || '');
          r.onerror = () => reject(new Error('לא הצלחנו לקרוא את הקובץ'));
          r.readAsDataURL(file);
        });
      }
      fileInput.addEventListener('change', updateFileLabel);

      uploadForm.addEventListener('submit', async e => {
        e.preventDefault();
        if (state.uploading) return;
        const t = findTask(state.upTask);
        const person = state.upPerson;
        const f = fileInput.files[0];
        if (!t) return toast('המטלה לא נמצאה');
        if (!person) return toast('בחרו מי מגיש');
        if (!f) return toast('בחרו קובץ PDF');
        if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') return toast('אפשר להעלות רק קובץ PDF');
        if (f.size > MAX_MB * 1024 * 1024) return toast(`הקובץ גדול מדי (עד ${MAX_MB}MB)`);
        setUploadBusy(true);
        let queued = false;
        try {
          const b64 = await readBase64(f);
          // דרך אותו תור של שאר השינויים, כדי לשמור על הסדר
          state.pending++; queued = true;
          const p = queue.then(() => call('uploadSubmission', t.id, person, b64));
          queue = p.catch(() => {});
          const d = await p;
          state.pending--; queued = false;
          if (state.pending === 0) state.data = d;
          storeSet('me', person);
          setUploadBusy(false);
          uploadModal.hidden = true;
          render();
          toast('הקובץ הועלה לדרייב ✓');
        } catch (err) {
          if (queued) state.pending--;
          setUploadBusy(false);
          toast((err && err.message) ? 'ההעלאה נכשלה: ' + err.message : 'ההעלאה נכשלה, נסו שוב');
        }
      });

      // ---------- events ----------
      document.addEventListener('click', e => {
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const act = el.dataset.act;
        const id = el.dataset.id;
        const exp = id && state.data ? findExp(id) : null;

        const task = id && state.data ? findTask(id) : null;

        const TASK_ACTS = ['add-task', 'edit-task', 'del-task', 'toggle-sub', 'upload'];
        if (state.data && state.data.tasksLocked && TASK_ACTS.indexOf(act) !== -1) return toast('העלאת מטלות תתאפשר בהמשך');

        if (act === 'page') {
          if (state.page !== el.dataset.page) { state.page = el.dataset.page; state.shownTab = null; render(); window.scrollTo(0, 0); }
        }
        else if (act === 'add-task') openTaskModal(null);
        else if (act === 'edit-task' && task) openTaskModal(task);
        else if (act === 'close-task') closeTaskModal();
        else if (act === 'pick-place') {
          const p = el.dataset.p;
          if (!p) {
            state.taskOther = !state.taskOther;
            if (state.taskOther) setTimeout(() => document.getElementById('task-other').focus(), 50);
          } else {
            const i = state.taskPlaces.indexOf(p);
            i === -1 ? state.taskPlaces.push(p) : state.taskPlaces.splice(i, 1);
          }
          renderPlacePick();
        }
        else if (act === 'del-task' && task) {
          if (String(task.id).startsWith('tmp-')) return toast('רגע, עדיין שומר…');
          if (!confirm(`למחוק את המטלה "${task.title}"?\n(קבצים שכבר עלו לדרייב לא יימחקו)`)) return;
          mutate(() => call('deleteAssignment', task.id), () => {
            state.data.assignments = tasksOf().filter(t => t.id !== task.id);
            state.data.submissions = (state.data.submissions || []).filter(s => s.aid !== task.id);
          }, 'נמחק');
        }
        else if (act === 'toggle-sub' && task) toggleSub(task.id, el.dataset.name, !subFor(task.id, el.dataset.name));
        else if (act === 'upload' && task) openUpload(task, el.dataset.name);
        else if (act === 'up-person') { if (!state.uploading) { state.upPerson = el.dataset.name; renderUploadPeople(); } }
        else if (act === 'close-upload') closeUpload();
        else if (act === 'mark-no-file') {
          if (state.uploading) return;
          const t = findTask(state.upTask);
          if (!t) return;
          if (!state.upPerson) return toast('בחרו מי הגיש');
          if (subFor(t.id, state.upPerson)) { uploadModal.hidden = true; return toast('כבר מסומן שהגשת'); }
          storeSet('me', state.upPerson);
          uploadModal.hidden = true;
          toggleSub(t.id, state.upPerson, true);
        }
        else if (act === 'copy-missing' && task) {
          const inSet = new Set(submittedPeople(task));
          const missing = state.data.people.filter(p => !inSet.has(p));
          copyText(`עוד לא הגישו את "${task.title}":\n` + missing.map(p => '• ' + p).join('\n'), 'הרשימה הועתקה');
        }
        else if (act === 'pick') { state.person = el.dataset.name; state.shownTab = null; storeSet('person', state.person); render(); window.scrollTo(0, 0); }
        else if (act === 'switch') { state.person = null; storeSet('person', null); render(); }
        else if (act === 'tab') { state.tab = el.dataset.type; storeSet('tab', state.tab); render(); }
        else if (act === 'refresh') refresh(true);
        else if (act === 'retry') { app.innerHTML = '<div class="center-state"><div class="spinner"></div></div>'; refresh(); }
        else if (act === 'add') openModal();
        else if (act === 'close-modal') closeModal();
        else if (act === 'forms') openForms();
        else if (act === 'close-forms') formsModal.hidden = true;
        else if (act === 'toast-act') { const a = toastAction; hideToast(); if (a) a.fn(); }
        else if (act === 'pick-type') { if (state.addType !== el.dataset.type) state.addChoice = null; state.addType = el.dataset.type; renderTypePick(); }
        else if (act === 'pick-cat') { state.addChoice = el.dataset.name; updateChoice(false); }
        else if (act === 'toggle') toggleCard(id);
        else if (act === 'copy' && exp) {
          const s = stagesOf(exp.type)[exp.stage - 1];
          if (s) copyText(fillMessage(s.message, exp));
        }
        else if (act === 'move' && exp) goStage(exp.id, exp.stage + Number(el.dataset.d));
        else if (act === 'jump' && exp) goStage(exp.id, Number(el.dataset.s));
        else if (act === 'del' && exp) {
          if (String(exp.id).startsWith('tmp-')) return toast('רגע, עדיין שומר…');
          if (!confirm(`למחוק את "${exp.title}"?`)) return;
          mutate(() => call('deleteExperience', exp.id), () => {
            state.data.experiences = state.data.experiences.filter(x => x.id !== exp.id);
          }, 'נמחק');
        }
      });

      document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); formsModal.hidden = true; closeTaskModal(); closeUpload(); } });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.data) refresh(true); });

      refresh();
    </script>
  </body>
</html>
